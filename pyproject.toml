[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openpyxl-simple"
version = "0.1.0"
description = "A simple wrapper for openpyxl to easily read and write Excel/CSV files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "curoa" },
]
keywords = ["openpyxl", "excel", "csv", "table", "simple"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "openpyxl>=3.1.5",
]

[project.urls]
Homepage = "https://github.com/curoa/openpyxl-simple"
Repository = "https://github.com/curoa/openpyxl-simple"
Issues = "https://github.com/curoa/openpyxl-simple/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
